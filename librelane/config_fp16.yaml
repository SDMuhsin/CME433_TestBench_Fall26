# LibreLane Classic config -- Chipathon 2026 project A56, block "ACV", FP16 END-TO-END variant.
#
# Hardens dla_fp16_chip (rtl/dla_fp16_chip.sv): the on-chip G300 GAN generator with an
# IEEE-binary16 datapath (quad host IF + CSR + stream sequencer + 1 FP16xFP16->FP32 MAC
# lane + FP16 epilogue/tanh-threshold ROM).  Derived from config_e2e.yaml: SAME die/core,
# A56_ACV.def pin template, 8 SRAM macro SITES (new instance names: GEN_ACT[0..3] =
# activation pairs on the old A-row sites, GEN_PIX[0..3] = pixel buffer on the old
# B-col sites), PDN, routing obstructions, antenna settings and 40 ns clock.
# Deltas vs config_e2e.yaml:
#   - DESIGN_NAME dla_fp16_chip; RTL list = fp16_*.v + fp32_add_rne.v + e2e_host_qspi.v
#   - MACROS instance keys renamed (locations/orientations identical)
#   - PL_TARGET_DENSITY_PCT 56 -> 50 (Yosys synth ~107 k um^2 vs ~458 k for dla_e2e_chip;
#     50 = the config_acv.yaml value)
#   - Slew/cap closure (2026-10-13, iterations fp16_r0..r11; r0/r5/r8 kept): PnR-only over-constrained SDC, post-GRT
#     design repair, no heuristic diodes, wire-length buffering, smaller CTS sink clusters;
#     signoff SDC = base.sdc WITHOUT the blanket 0.2 pF set_max_capacitance (see below)
# Build: ./build_fp16_connected.sh <TAG>
meta:
  version: 3
  flow: Classic

DESIGN_NAME: dla_fp16_chip

PDK: gf180mcuD

STD_CELL_LIBRARY: gf180mcu_as_sc_mcu7t3v3

# --- Synthesizable RTL: core + bridge + chip-level top -----------------------
VERILOG_FILES:
  - dir::../rtl/fp16_mul.v
  - dir::../rtl/fp32_add_rne.v
  - dir::../rtl/fp16_lane.v
  - dir::../rtl/fp16_tanh_rom.v
  - dir::../rtl/fp16_epi.v
  - dir::../rtl/fp16_seq.v
  - dir::../rtl/fp16_csr.v
  - dir::../rtl/gf180_sram_1rw_256x8.v
  - dir::../rtl/e2e_host_qspi.v
  - dir::../rtl/dla_fp16_chip.sv

# Force the `ifdef SYNTHESIS` branch so the SRAMs elaborate as
# (* blackbox *) macros, not behavioral flip-flops.
VERILOG_DEFINES:
  - SYNTHESIS

CLOCK_PORT: clk
CLOCK_PERIOD: 40

# --- Pre-hardened GF180 SRAM macro (foundry views) ---------------------------
# EIGHT instances, each 301.30 (W) x 224.93 (H) um, on exactly the dla_e2e_chip sites
# (4x2 grid, 55 um channels, ~245 um west channel for the control logic / west-edge pins).
#   columns x = 244.90 / 601.20 / 957.50 / 1313.80 ; rows y = 297.57 (bottom) / 577.50 (top)
MACROS:
  gf180mcu_ocd_ip_sram__sram256x8m8wm1:
    gds:
      - dir::../gf180mcu_ocd_ip_sram__sram256x8m8wm1/gf180mcu_ocd_ip_sram__sram256x8m8wm1.gds
    lef:
      - dir::../gf180mcu_ocd_ip_sram__sram256x8m8wm1/gf180mcu_ocd_ip_sram__sram256x8m8wm1.lef
    lib:
      "*_tt_025C_3v30":
        - dir::../gf180mcu_ocd_ip_sram__sram256x8m8wm1/gf180mcu_ocd_ip_sram__sram256x8m8wm1__tt_025C_3v30.lib
      "*_ss_125C_3v00":
        - dir::../gf180mcu_ocd_ip_sram__sram256x8m8wm1/gf180mcu_ocd_ip_sram__sram256x8m8wm1__ss_125C_3v00.lib
      "*_ff_n40C_3v60":
        - dir::../gf180mcu_ocd_ip_sram__sram256x8m8wm1/gf180mcu_ocd_ip_sram__sram256x8m8wm1__ff_n40C_3v60.lib
    instances:
      # --- activation pairs (bottom row, old A-row sites): P0 = [0] lo,[1] hi ; P1 = [2] lo,[3] hi ---
      "GEN_ACT[0].u_sram.u_sram":
        location: [244.90, 297.57]
        orientation: N
      "GEN_ACT[1].u_sram.u_sram":
        location: [601.20, 297.57]
        orientation: N
      "GEN_ACT[2].u_sram.u_sram":
        location: [957.50, 297.57]
        orientation: N
      "GEN_ACT[3].u_sram.u_sram":
        location: [1313.80, 297.57]
        orientation: N
      # --- pixel buffer 1024x8 (top row, old B-col sites): pixel p in GEN_PIX[p/256] ---
      "GEN_PIX[0].u_sram.u_sram":
        location: [244.90, 577.50]
        orientation: N
      "GEN_PIX[1].u_sram.u_sram":
        location: [601.20, 577.50]
        orientation: N
      "GEN_PIX[2].u_sram.u_sram":
        location: [957.50, 577.50]
        orientation: N
      "GEN_PIX[3].u_sram.u_sram":
        location: [1313.80, 577.50]
        orientation: N

# --- Floorplan: fixed by the ACV project template ----------------------------
# A56_ACV.def sets the 1675 x 1110 um die + the 62 signal pins (all on the west
# edge).  DIE_AREA is set to match so the pre-template floorplan agrees.
FP_SIZING: absolute
DIE_AREA: [0, 0, 1675, 1110]
# Shrink the core to a ~40 um die-to-core margin (was ~7 um) so a PDN core ring
# fits in that margin, right where the ACV template's die-edge power pins are.
# The 8 macros (x 244.9-1615.1, y 297.6-802.4) already sit well inside this core.
CORE_AREA: [40, 40, 1635, 1070]
FP_DEF_TEMPLATE: dir::A56_ACV.def
# permissive (not strict): the PDN creates DVDD/DVSS power block-terminals in the
# design, but relocate_pins compares them against the template's NON-power pin set,
# so strict mode always flags DVDD/DVSS as spurious "extra design pins" and aborts.
# The 62 signal pins are pre-verified to match the template exactly (only DVDD/DVSS
# differ), and FP_TEMPLATE_COPY_POWER_PINS still relocates DVDD/DVSS onto the
# template's west/north power-pin positions.
FP_TEMPLATE_MATCH_MODE: permissive
FP_TEMPLATE_COPY_POWER_PINS: true
PL_TARGET_DENSITY_PCT: 50

# Cell padding for antenna-diode pin access (gf180 default is 0).
GPL_CELL_PADDING: 1
DPL_CELL_PADDING: 2

# --- Power / ground: single 3.3 V supply, named to match the ACV pads --------
# The padframe's power pin is DVDD (W21) and ground is DVSS (W22), both on the west
# edge, so the chip power/ground nets are DVDD/DVSS (not VDD/VSS).  set_global_connections and
# pdn_cfg.tcl are fully parametrized on $VDD_NET/$GND_NET, so this just renames.
VDD_NETS:
  - DVDD
GND_NETS:
  - DVSS
# Connect each SRAM macro's own VDD/VSS pins to the DVDD/DVSS chip nets.
# Format: <inst_regex> <core_power_net> <core_ground_net> <macro_power_pin> <macro_ground_pin>
PDN_MACRO_CONNECTIONS:
  - ".*u_sram.* DVDD DVSS VDD VSS"

# --- PDN straps + core ring --------------------------------------------------
# A DVDD/DVSS core ring in the widened die-to-core margin (see CORE_AREA) gives a
# clean power structure at the block boundary for the ACV template's die-edge
# power pins to connect to -- avoiding the congested core edge that shorted a
# direct hand-stamp. The ring requires the multilayer grid (Metal4 V + Metal5 H);
# ring widths/offsets come from the PDK (FP_PDN_CORE_RING_* = 1.6 um / 6 um).
PDN_MULTILAYER: true
PDN_CORE_RING: true
PDN_VWIDTH: 5
PDN_HWIDTH: 5
PDN_VSPACING: 1
PDN_HSPACING: 1
PDN_VPITCH: 75
PDN_HPITCH: 75
PDN_EXTEND_TO: core_ring

# gf180 OCD SRAM power pins top out at Metal3; connect them up to the Metal4
# vertical straps (Metal4<->Metal5 stock connect makes no vias).
PDN_CFG: dir::pdn_cfg.tcl

# --- Routing / signoff -------------------------------------------------------
RT_MAX_LAYER: Metal5

# Block-level IR-drop analysis is skipped: FP_TEMPLATE_COPY_POWER_PINS relocates
# the DVDD/DVSS pins to the template's Metal2 edge positions (where the shared
# padring delivers power), which the block's internal PDN does not via-stack to,
# so PSM reports them "unconnected" and aborts. Per OpenROAD's own note this is
# ignorable for a block that is not itself the top-level manufactured chip (the
# organiser integrates power at chip level). DRC/LVS remain the real signoff.
RUN_IRDROP_REPORT: false  # plain-harden default (PSM aborts on the pre-connector islanded pins). On the CONNECTED design IR IS measurable -- resume `--from OpenROAD.RCX` with this set true: worst DVDD drop 54.8 mV / DVSS bounce 70.6 mV @ ~125 mW, <=3.8% of 3.3 V (measured 2026-08-25, run acv_ring4).

# --- Antenna mitigation (pre-route heuristic diodes + GRT repair + post-DRT repair) ---
# FP16 iteration lesson: heuristic diodes were inserted AFTER the last design repair and pushed
# ss-corner slews past 1.5 ns (5,200 diodes; 226 slew vios in fp16_r0). GRT + post-DRT antenna
# repair alone still close antenna to 0.
RUN_HEURISTIC_DIODE_INSERTION: false
# Bumped 25 -> 50 -> 75 (2026-08-25): the new west-edge pin template re-rolled routing
# to 5 antenna nets (from 1); a more aggressive global-route diode margin inserts diodes
# on more near-limit nets pre-detailed-route.  25->5 nets, 50->3 nets (acv_ring2/3);
# 75 targets the two ~1.1x marginals to land at just net5 (the structural net the prior
# submission also shipped with).
GRT_ANTENNA_REPAIR_MARGIN: 75
# Post-DRT antenna repair (repro2 lesson): detailed routing can lengthen a near-limit
# net past the ratio after GRT repair; jumper-only DRT repair inserted 0 jumpers there,
# full (diode) repair closed it.
DRT_ANTENNA_REPAIR_ITERS: 3
DRT_ANTENNA_REPAIR_JUMPER_ONLY: false
DIODE_ON_PORTS: in
PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# --- Auditor keep-out (2026-09-01 padframe revision) -------------------------
# The re-issued A56_ACV.def adds a Metal2 BLOCKAGE in the NE die corner
# (DEF: RECT 322000 221600 335000 222000 @ 200 dbu/um = x 1610-1675, y 1108-1110 um)
# to remove an integration shorting risk.  Odb.ApplyDEFTemplate only relocates pins
# -- it ignores template blockages -- so the keep-out is enforced natively here:
# Odb.AddRoutingObstructions honours it during global+detailed routing, and
# Odb.RemoveRoutingObstructions strips it again before Magic.StreamOut (so it is
# NOT painted as a metal sheet).  Our route already clears this corner by ~29 um,
# so this is belt-and-suspenders that also makes the layout provably respect the
# official template.  Coords are in microns (layer, llx, lly, urx, ury).
ROUTING_OBSTRUCTIONS:
- ["Metal2", 1610.0, 1108.0, 1675.0, 1110.0]

# --- Slew / cap closure + SDC split (FP16, 2026-10-13; = run fp16_r5 settings) ---------
# PnR SDC over-constrains max_transition 0.9 ns / max_capacitance 0.12 pF so resizer repair
# leaves headroom for routed SPEF parasitics + antenna diodes.
PNR_SDC_FILE: dir::fp16_pnr.sdc
# Signoff SDC = base.sdc with max_transition 1.5 ns (= the std-cell lib default_max_transition)
# and NO blanket set_max_capacitance: cap is checked against the liberty-characterized per-pin
# max_capacitance. The PDK flow default MAX_CAPACITANCE_CONSTRAINT 0.2 pF is unattainable here:
# each SRAM CLK pin alone is 0.314 pF (ss) / 0.294 pF (tt), so >= 8 nets always violate it.
SIGNOFF_SDC_FILE: dir::fp16_signoff.sdc
RUN_POST_GRT_DESIGN_REPAIR: true
DESIGN_REPAIR_MAX_SLEW_PCT: 40
DESIGN_REPAIR_MAX_CAP_PCT: 40
GRT_DESIGN_REPAIR_MAX_SLEW_PCT: 30
GRT_DESIGN_REPAIR_MAX_CAP_PCT: 30
DESIGN_REPAIR_MAX_WIRE_LENGTH: 500
GRT_DESIGN_REPAIR_MAX_WIRE_LENGTH: 500
CTS_SINK_CLUSTERING_SIZE: 12
CTS_SINK_CLUSTERING_MAX_DIAMETER: 50
